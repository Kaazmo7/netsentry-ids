[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netsentry-ids"
version = "1.0.0"
description = "Signature + anomaly based network intrusion detection engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Matthew Dudley" }]
dependencies = ["scapy>=2.5", "rich>=13.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
netsentry = "netsentry.__main__:main"

[tool.setuptools.packages.find]
include = ["netsentry*"]
